name: ORIN DevSecOps Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
      - "argocd/**"
      - "**/*.md"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  NODE_VERSION: "20"

jobs:
  # ------------------------------------------------------------------
  # 1. Quality gate: typecheck + build
  # ------------------------------------------------------------------
  quality:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # ------------------------------------------------------------------
  # 2. SAST + secret scanning
  # ------------------------------------------------------------------
  sast:
    name: SAST (Semgrep) + Secrets (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Semgrep scan
        uses: docker://semgrep/semgrep:latest
        with:
          args: >-
            semgrep scan
            --config p/javascript --config p/typescript --config p/react
            --config p/nodejs --config p/jwt --config p/secrets
            --exclude node_modules --exclude dist
            --sarif --output semgrep.sarif
            --error --severity ERROR
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true   # needs GitHub code scanning enabled on the repo
      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-report
          path: semgrep.sarif
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 3. Dependency scanning (SCA)
  # ------------------------------------------------------------------
  dependency-scan:
    name: Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (root, server, client lockfiles)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,license
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: dependency-report.txt
          exit-code: "1"
      - name: Show report
        if: always()
        run: cat dependency-report.txt || true
      - name: Generate SBOM (CycloneDX)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-reports
          path: |
            dependency-report.txt
            sbom.cdx.json

  # ------------------------------------------------------------------
  # 4. Build images, scan them, push on main
  # ------------------------------------------------------------------
  build:
    name: Build & Scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [quality, sast, dependency-scan]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [server, client]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          load: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/orin-${{ matrix.component }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/orin-${{ matrix.component }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Save image for DAST
        if: github.event_name == 'push'
        run: docker save ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/orin-${{ matrix.component }}:${{ steps.meta.outputs.tag }} -o ${{ matrix.component }}.tar
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: image-${{ matrix.component }}
          path: ${{ matrix.component }}.tar
          retention-days: 1
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push'
        run: docker push ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/orin-${{ matrix.component }}:${{ steps.meta.outputs.tag }}

  # ------------------------------------------------------------------
  # 5. DAST: run the full stack and attack it with OWASP ZAP
  # ------------------------------------------------------------------
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
      - name: Load images
        run: |
          docker load -i server.tar
          docker load -i client.tar
      - name: Start stack
        env:
          IMAGE_OWNER: ${{ needs.build.outputs.owner }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          docker compose -f docker-compose.ci.yml up -d
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health && break || sleep 3
          done
          curl -sf http://localhost:8080/ > /dev/null
      - name: ZAP baseline scan
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$(pwd)/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 -r zap-report.html -J zap-report.json -I
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-report
          path: zap/
      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  # ------------------------------------------------------------------
  # 6. GitOps: bump image tags in k8s/, Argo CD picks up the commit
  # ------------------------------------------------------------------
  gitops-update:
    name: Update GitOps manifests
    runs-on: ubuntu-latest
    needs: [build, dast]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set new image tags
        run: |
          OWNER=${{ needs.build.outputs.owner }}
          TAG=${{ needs.build.outputs.tag }}
          for c in server client; do
            yq -i "(.images[] | select(.name == \"orin-$c\")) |= (.newName = \"ghcr.io/$OWNER/orin-$c\" | .newTag = \"$TAG\")" k8s/kustomization.yaml
          done
          cat k8s/kustomization.yaml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "ci: deploy ${{ needs.build.outputs.tag }} [skip ci]" || echo "No changes"
          git push
