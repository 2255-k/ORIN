apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/2255-k/ORIN.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: orin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
