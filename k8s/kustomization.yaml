apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orin
resources:
  - namespace.yaml
  - mongo.yaml
  - server.yaml
  - client.yaml
  - ingress.yaml
# The CI pipeline rewrites newName/newTag below on every successful main build.
images:
  - name: orin-server
    newName: ghcr.io/2255-k/orin-server
    newTag: latest
  - name: orin-client
    newName: ghcr.io/2255-k/orin-client
    newTag: latest
