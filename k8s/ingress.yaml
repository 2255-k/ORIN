apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orin
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # keep websockets alive
spec:
  ingressClassName: nginx
  rules:
    - host: orin.example.com   # change me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port: { number: 80 }
