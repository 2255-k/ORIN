apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 1   # Socket.IO with >1 replica needs sticky sessions + a Redis adapter
  selector:
    matchLabels: { app: server }
  template:
    metadata:
      labels: { app: server }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: server
          image: orin-server   # replaced by kustomize `images:`
          ports:
            - containerPort: 5000
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "5000" }
            - { name: MONGODB_URI, value: "mongodb://mongo:27017/orin" }
            - { name: CLIENT_URL, value: "https://orin.example.com" }
            - { name: COOKIE_SECURE, value: "true" }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: orin-secrets, key: JWT_SECRET }
          readinessProbe:
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: uploads, mountPath: /app/uploads }
      volumes:
        - name: uploads
          emptyDir: {}   # swap for a PVC, or set Cloudinary vars, to keep attachments
---
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  selector: { app: server }
  ports:
    - port: 5000
      targetPort: 5000
